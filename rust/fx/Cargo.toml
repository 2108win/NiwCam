[package]
name = "niwcam-fx"
description = "NiwCam pause picture, face detection, person segmentation and window capture (Rust port of StillPicture, FaceDetect, Segmenter, WindowSource)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
niwcam-core = { path = "../core" }
windows-numerics = "0.3"
windows-collections = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "AI_MachineLearning",
    "Foundation",
    "Foundation_Collections",
    "Foundation_Metadata",
    "Foundation_Numerics",
    "Security_Authorization_AppCapabilityAccess",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Media",
    "Media_FaceAnalysis",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]

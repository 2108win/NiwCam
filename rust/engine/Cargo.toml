[package]
name = "niwcam-engine"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "NiwCamEngine"
crate-type = ["cdylib", "rlib"]

[dependencies]
niwcam-core = { path = "../core" }
niwcam-shm = { path = "../shm" }
niwcam-phone = { path = "../phone" }
niwcam-media = { path = "../media" }
niwcam-fx = { path = "../fx" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Deliberately not `workspace = true`: the workspace forbids `unsafe`, and this crate is the OS
# layer (Media Foundation, Win32). Every unsafe block carries a SAFETY comment.
[lints]

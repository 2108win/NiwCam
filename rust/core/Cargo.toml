[package]
name = "niwcam-core"
description = "NiwCam protocol, crypto and picture maths (Rust port of src/engine, no OS calls)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
sha2 = "0.10"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdh"] }
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

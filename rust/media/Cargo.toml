[package]
name = "niwcam-media"
description = "NiwCam media: decoder MFT, webcam enumeration, WASAPI audio out, MP4 recorder (Rust port of src/engine + src/common)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
niwcam-core = { path = "../core" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

# Deliberately not `workspace = true`: the workspace forbids `unsafe`, and this crate is the OS
# layer (Media Foundation, WASAPI, WIC). Every unsafe block carries a SAFETY comment.
[lints]
